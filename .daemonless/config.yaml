icon: ':simple-transmission:'
cit:
  mode: health
  port: 9091
  health: /transmission/web/
build:
  pkg_name: transmission-daemon
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: pkg
      containerfile: Containerfile.pkg
      aliases: ["latest"]
      default: true
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15-latest"
